name: Terraform CI/CD v3

on:
  workflow_dispatch:
  
  push:
    branches:
      - dev
    paths:
      - terraform/**
  pull_request:
    branches:
      - dev

env:
  TF_VERSION: "1.5.7"
  TF_ROOT: ./terraform
  TF_LOG: INFO
  ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

jobs:
  set-environment: 
    runs-on: ubuntu-latest
    outputs: 
      current_env: ${{ steps.set_env.outputs.current_env }}
      enviroment_tfvars: ""
    steps:
      - name: Check if prod
        if: endsWith(github.ref, '/main')
        run: |
          echo "ENVIRONMENT_NAME=prod" >> $GITHUB_ENV
          echo "ENV_TFVARS=environment/datalake/prod.tfvars" >> $GITHUB_ENV
      - name: Check if dev
        if: endsWith(github.ref, '/dev')
        run: |
          echo "ENVIRONMENT_NAME=dev" >> $GITHUB_ENV
          echo "ENV_TFVARS=environment/datalake/dev.tfvars" >> $GITHUB_ENV
      - name: Set output
        id: set_env
        run: |
          echo "current_env=${{ env.ENVIRONMENT_NAME }}" >> $GITHUB_OUTPUT
          echo "enviroment_tfvars=${{ env.ENV_TFVARS }}" >> $GITHUB_OUTPUT

  terraform:
   name: "Terraform validation"
   runs-on: ubuntu-latest
   needs: set-environment 
   environment: ${{ needs.set-environment.outputs.current_env }}
   defaults:
     run:
       shell: bash
       working-directory: ${{ env.TF_ROOT }}
 
   steps:
     - name: Checkout the repository to the runner
       uses: actions/checkout@v4
      
     - name: Configurar credenciales de AWS
       uses: aws-actions/configure-aws-credentials@v4
       with:
         aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
         aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

     - name: Setup Terraform with specified version on the runner
       uses: hashicorp/setup-terraform@v3
       with:
         terraform_version: ${{ env.TF_VERSION }}
    
     - name: Terraform init
       id: init
       env:
        TF_BUCKET_STATE: ${{ vars.TF_BUCKET_STATE }}
       run: terraform init -backend-config="bucket=$TF_BUCKET_STATE"
      
     - name: Terraform Format Check
       id: ftm
       run: terraform fmt -check -recursive

     - name: Terraform validation
       id: validation
       run: terraform validate

  deploy:
   name: "Terraform deploy"
   runs-on: ubuntu-latest
   needs: [set-environment, terraform]
   environment: ${{ needs.set-environment.outputs.current_env }}
   defaults:
     run:
       shell: bash
       working-directory: ${{ env.TF_ROOT }}

   steps:
    - name: Checkout the repository to the runner
      uses: actions/checkout@v4
      
    - name: Configurar credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
         aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
         aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

    - name: Setup Terraform with specified version on the runner
      uses: hashicorp/setup-terraform@v3
      with:
         terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform init
      id: init
      env:
        TF_BUCKET_STATE: ${{ vars.TF_BUCKET_STATE }}
      run: terraform init -backend-config="bucket=$TF_BUCKET_STATE"

    - name: Terraform plan
      id: plan
      env: 
        ENV_TFVARS: ${{ needs.set-environment.outputs.enviroment_tfvars }}
      run: terraform plan -var-file $ENV_TFVARS

    - name: Terraform apply
      id: apply
      env: 
        ENV_TFVARS: ${{ needs.set-environment.outputs.enviroment_tfvars }}
      run: terraform apply -var-file $ENV_TFVARS -auto-approve
